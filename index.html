<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="description" content="moviebox-2 — explore tout le catalogue mondial de films, séries et animés, regarde gratuitement les films libres de droits et retrouve les offres légales gratuites." />
		<meta name="theme-color" content="#07070A" />
		<meta name="color-scheme" content="dark" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="moviebox-2" />

		<!-- Connexions anticipées : affiches TMDB et médias du domaine public.
		     Les polices sont hébergées localement (aucun appel à Google Fonts). -->
		<link rel="preconnect" href="https://image.tmdb.org" />
		<link rel="preconnect" href="https://archive.org" />
		<link rel="dns-prefetch" href="https://ia600000.us.archive.org" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/apple-touch-icon.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="/favicon-16x16.png"
		/>
		<link rel="manifest" href="/site.webmanifest" />
		<title>moviebox-2 — Films, séries et films gratuits</title>

		<!-- Fond sombre immédiat : évite le flash blanc avant le chargement du CSS. -->
		<style>
			html,
			body {
				margin: 0;
				background-color: #07070a;
				color: #fff;
			}
			#root {
				min-height: 100svh;
			}

			/* Écran d'ouverture : affiché avant même le chargement du bundle. */
			#boot-splash {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: grid;
				justify-items: center;
				align-content: center;
				gap: 18px;
				background:
					radial-gradient(80% 60% at 50% 12%, #0b2413 0%, transparent 70%),
					#07070a;
				color: #fff;
				transition: opacity 0.35s ease, visibility 0.35s ease;
			}
			#boot-splash.is-hidden {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
			}
			#boot-splash img {
				width: 96px;
				height: 96px;
				border-radius: 24px;
				box-shadow: 0 18px 60px rgba(34, 197, 94, 0.22);
			}
			#boot-splash .boot-title {
				margin: 0;
				font: 700 20px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
				letter-spacing: 0.02em;
			}
			#boot-splash .boot-hint {
				margin: -8px 0 0;
				color: rgba(255, 255, 255, 0.42);
				font: 500 12px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
			}
			#boot-splash .boot-spinner {
				width: 26px;
				height: 26px;
				border-radius: 50%;
				border: 2px solid rgba(255, 255, 255, 0.14);
				border-top-color: #22c55e;
				animation: boot-spin 0.85s linear infinite;
			}
			@keyframes boot-spin {
				to {
					transform: rotate(360deg);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#boot-splash .boot-spinner {
					animation: none;
					border-top-color: rgba(255, 255, 255, 0.35);
				}
			}
		</style>
	</head>
	<body>
		<div id="boot-splash" role="status" aria-live="polite" aria-label="Ouverture de moviebox-2">
			<img src="/android-chrome-192x192.png" alt="" width="96" height="96" />
			<p class="boot-title">moviebox-2</p>
			<p class="boot-hint">Chargement du catalogue…</p>
			<span class="boot-spinner" aria-hidden="true"></span>
		</div>

		<div id="root"></div>
		<script>
			(function () {
				var splash = document.getElementById("boot-splash");
				window.__hideBootSplash = function () {
					if (!splash) return;
					splash.classList.add("is-hidden");
					window.setTimeout(function () {
						if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
					}, 400);
				};
				// Filet de sécurité : l'écran ne doit jamais rester bloqué.
				window.setTimeout(function () {
					if (window.__hideBootSplash) window.__hideBootSplash();
				}, 15000);
			})();
		</script>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
