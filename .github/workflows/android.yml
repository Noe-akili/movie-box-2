name: Build Android APK

# Compilation entierement deleguee a GitHub : aucune dependance (JDK, SDK/NDK
# Android, Rust targets, npm) n'est requise en local.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "28.2.13676358"
  # Cible CPU de l'APK (couvre la quasi-totalite des telephones recents).
  ANDROID_TARGET: aarch64

jobs:
  android:
    # Image epinglee (le SDK Android est preinstalle dessus).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Configure preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          CMDLINE_BIN="$(dirname "$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)")"
          echo "CMDLINE_BIN=$CMDLINE_BIN" >> "$GITHUB_ENV"
          echo "$CMDLINE_BIN" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "SDK Android detecte : $SDK_ROOT (cmdline-tools: $CMDLINE_BIN)"

      - name: Install Android SDK / NDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Generate app icons from the app logo
        run: npx tauri icon src/images/logo.png

      - name: Set adaptive icon background (logo's dark green)
        run: |
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#05190A</color>\n</resources>\n' \
            > src-tauri/icons/android/values/ic_launcher_background.xml

      - name: Initialize Android project
        run: npx tauri android init --ci

      # `tauri android init` ne recopie PAS src-tauri/icons/android/* : sans
      # cette étape l'APK garde les icônes par défaut du CLI au lieu du logo.
      - name: Install the app logo as Android launcher icons
        run: node scripts/install-android-icons.mjs

      - name: Patch Android manifest (cleartext -> images/medias distants)
        run: node scripts/patch-android-manifest.mjs

      - name: Generate Android signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/moviebox.keystore" \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias moviebox \
            -storepass moviebox -keypass moviebox \
            -dname "CN=Movie Box,O=Movie Box,C=US"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=moviebox
          password=moviebox
          storeFile=$RUNNER_TEMP/moviebox.keystore
          EOF

      - name: Build release APK
        run: npx tauri android build --ci --apk -t "${ANDROID_TARGET}"

      - name: Ensure the APK is signed
        run: |
          set -euo pipefail
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk"
          SIGNED="$(find "$APK_DIR" -type f -name '*.apk' ! -name '*-unsigned.apk' 2>/dev/null | head -1 || true)"
          if [ -z "$SIGNED" ]; then
            UNSIGNED="$(find "$APK_DIR" -type f -name '*-unsigned.apk' | head -1)"
            SIGNED="${UNSIGNED%-unsigned.apk}.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks "$RUNNER_TEMP/moviebox.keystore" \
              --ks-pass pass:moviebox --key-pass pass:moviebox \
              --ks-key-alias moviebox \
              --out "$SIGNED" "$UNSIGNED"
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$SIGNED"
          echo "APK_SIGNED=$SIGNED" >> "$GITHUB_ENV"

      # Diagnostic de l'edition de liens : verifie que le binaire Android
      # contient bien les commandes declarees dans `lib.rs`
      # (`generate_handler![server_origin, api_request]`) et la cle du bundle
      # frontend courant. Objectif : detecter une incoherence entre les sources
      # et le `.so` genere (ex. filtrage ACL, cache Rust obsolete).
      - name: Diagnose native library (command registration sanity check)
        continue-on-error: true
        run: |
          set -euo pipefail
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk"
          APK="$(find "$APK_DIR" -type f -name '*.apk' ! -name '*-unsigned.apk' 2>/dev/null | head -1 || true)"
          if [ -z "$APK" ]; then
            APK="$(find "$APK_DIR" -type f -name '*.apk' 2>/dev/null | head -1)"
          fi
          echo "APK inspecte : $APK"

          rm -rf /tmp/soinspect && mkdir -p /tmp/soinspect
          SO_ENTRY="$(unzip -Z1 "$APK" | grep -E '^lib/.*/libmovie_box_lib\.so$' | head -1)"
          echo "Entree .so : $SO_ENTRY"
          unzip -p "$APK" "$SO_ENTRY" > /tmp/soinspect/libmovie_box_lib.so
          SO=/tmp/soinspect/libmovie_box_lib.so
          ls -l "$SO"
          file "$SO" || true

          # `|| true` : `grep` sort 1 quand il n'y a aucune correspondance, et
          # `set -o pipefail` ferait alors echouer l'affectation.
          count() { { LC_ALL=C grep -a -o -- "$1" "$SO" 2>/dev/null || true; } | wc -l | tr -d ' '; }
          SRV="$(count server_origin)"
          API="$(count api_request)"
          ORIGIN="$(count moviebox.localhost)"
          DIST_KEY="$(basename "$(ls dist/assets/index-*.js | head -1)")"
          EMB="$(count "$DIST_KEY")"

          echo "server_origin=$SRV api_request=$API moviebox.localhost=$ORIGIN"
          echo "cle frontend attendue=$DIST_KEY presente_dans_so=$EMB"

          {
            echo "## Diagnostic \`.so\` Android"
            echo ""
            echo "| Chaine | Occurrences dans le .so |"
            echo "|---|---|"
            echo "| \`server_origin\` | $SRV |"
            echo "| \`api_request\` | $API |"
            echo "| \`moviebox.localhost\` | $ORIGIN |"
            echo "| \`$DIST_KEY\` | $EMB |"
          } >> "$GITHUB_STEP_SUMMARY"

          FAIL=0
          if [ "$API" -eq 0 ]; then
            echo "::error::api_request ABSENT du .so Android alors que lib.rs l'enregistre."
            FAIL=1
          fi
          if [ "$SRV" -eq 0 ]; then
            echo "::error::server_origin ABSENT du .so Android alors que lib.rs l'enregistre (incoherence de lien/filtrage)."
            FAIL=1
          fi
          if [ "$EMB" -eq 0 ]; then
            echo "::error::$DIST_KEY ABSENT du .so : le bundle frontend embarque n'est pas celui attendu."
            FAIL=1
          fi
          exit "$FAIL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: movie-box-android-release
          path: ${{ env.APK_SIGNED }}
          if-no-files-found: error
