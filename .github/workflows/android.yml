name: Build Android APK

# Compilation entierement deleguee a GitHub : aucune dependance (JDK, SDK/NDK
# Android, Rust targets, npm) n'est requise en local.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "27.1.12297006"
  # Cible CPU de l'APK (couvre la quasi-totalite des telephones recents).
  ANDROID_TARGET: aarch64

jobs:
  android:
    # Image epinglee (le SDK Android est preinstalle dessus).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Configure preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          CMDLINE_BIN="$(dirname "$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)")"
          echo "CMDLINE_BIN=$CMDLINE_BIN" >> "$GITHUB_ENV"
          echo "$CMDLINE_BIN" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "SDK Android detecte : $SDK_ROOT (cmdline-tools: $CMDLINE_BIN)"

      - name: Install Android SDK / NDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Generate app icons from the app logo
        run: npx tauri icon src/images/logo.png

      - name: Set adaptive icon background (logo's dark green)
        run: |
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#05190A</color>\n</resources>\n' \
            > src-tauri/icons/android/values/ic_launcher_background.xml

      - name: Initialize Android project
        run: npx tauri android init --ci

      # `tauri android init` ne recopie PAS src-tauri/icons/android/* : sans
      # cette étape l'APK garde les icônes par défaut du CLI au lieu du logo.
      - name: Install the app logo as Android launcher icons
        run: node scripts/install-android-icons.mjs

      - name: Patch Android project (cleartext + targetSdk sans bord-a-bord)
        run: node scripts/patch-android-manifest.mjs

      # Un keystore stable (secret) signe toutes les versions avec la MEME
      # signature : les mises a jour s'installent par-dessus l'app existante.
      # Sans secret, un keystore ephemere est genere (l'app ne pourra se mettre a
      # jour qu'apres une desinstallation unique).
      - name: Restore or generate Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            # Keystore stable fourni (PKCS12 par defaut, voir secrets).
            KEYSTORE="$RUNNER_TEMP/moviebox.p12"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            ALIAS="${ANDROID_KEY_ALIAS:-moviebox}"
            STOREPASS="${ANDROID_KEYSTORE_PASSWORD:-moviebox}"
            KEYPASS="${ANDROID_KEY_PASSWORD:-$STOREPASS}"
            TYPE="${ANDROID_KEYSTORE_TYPE:-PKCS12}"
            echo "Keystore stable restaure depuis les secrets GitHub (type=$TYPE)."
          else
            KEYSTORE="$RUNNER_TEMP/moviebox.keystore"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias moviebox \
              -storepass moviebox -keypass moviebox \
              -dname "CN=Movie Box,O=Movie Box,C=US"
            ALIAS=moviebox
            STOREPASS=moviebox
            KEYPASS=moviebox
            TYPE=JKS
            echo "::warning::Aucun secret ANDROID_KEYSTORE_BASE64 : signature ephemere. Les mises a jour exigeront une desinstallation manuelle."
          fi

          cat > src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=$ALIAS
          password=$STOREPASS
          storeFile=$KEYSTORE
          EOF

          {
            echo "ANDROID_KEY_ALIAS=$ALIAS"
            echo "ANDROID_STORE_PASSWORD=$STOREPASS"
            echo "ANDROID_KEY_PASSWORD=$KEYPASS"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_KEYSTORE_TYPE=$TYPE"
          } >> "$GITHUB_ENV"

      # versionCode croissant a chaque build : Android reconnait la nouvelle
      # version comme une mise a jour. Non committe (patch ephemere de la CI).
      - name: Bump Android version (versionCode / versionName)
        run: |
          node -e '
            const fs = require("fs");
            const file = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(file, "utf8"));
            const run = Number(process.env.GITHUB_RUN_NUMBER || 0);
            conf.bundle.android.versionCode = 1000000 + run;
            conf.version = `1.0.${run}`;
            fs.writeFileSync(file, JSON.stringify(conf, null, "\t") + "\n");
            console.log(`versionName=1.0.${run} versionCode=${1000000 + run}`);
          '

      - name: Build release APK
        run: npx tauri android build --ci --apk -t "${ANDROID_TARGET}"

      - name: Ensure the APK is signed
        run: |
          set -euo pipefail
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk"
          SIGNED="$(find "$APK_DIR" -type f -name '*.apk' ! -name '*-unsigned.apk' 2>/dev/null | head -1 || true)"
          if [ -z "$SIGNED" ]; then
            UNSIGNED="$(find "$APK_DIR" -type f -name '*-unsigned.apk' | head -1)"
            SIGNED="${UNSIGNED%-unsigned.apk}.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$ANDROID_KEYSTORE_PATH" \
              --ks-type "$ANDROID_KEYSTORE_TYPE" \
              --ks-pass "pass:$ANDROID_STORE_PASSWORD" --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --out "$SIGNED" "$UNSIGNED"
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$SIGNED"
          echo "APK_SIGNED=$SIGNED" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: movie-box-android-release
          path: ${{ env.APK_SIGNED }}
          if-no-files-found: error
