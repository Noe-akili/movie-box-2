[package]
name = "movie-box"
version = "1.0.0"
description = "Movie Box"
authors = ["Movie Box"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "movie_box_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-background-service = "1.0"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
movie-box-server = { path = "../server-rust" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
# Le backend est appelé en interne (IPC + protocole média) : le routeur Axum est
# réutilisé directement, sans ouvrir de socket réseau.
axum = "0.8"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
