[package]
name = "movie-box"
version = "1.0.0"
description = "Movie Box"
authors = ["Movie Box"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "movie_box_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
movie-box-server = { path = "../server-rust" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
